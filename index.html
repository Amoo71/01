<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Circus Baby's Ocean Facility</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;width:100vw;height:100vh;font-family:'Courier New',monospace;-webkit-user-select:none;user-select:none;touch-action:none}
canvas{display:block;position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover}

.hud{position:fixed;top:0;left:0;right:0;display:none;justify-content:space-between;padding:8px 12px;z-index:20;pointer-events:none}
.hud.on{display:flex}
.hb{background:rgba(0,0,0,.7);padding:4px 10px;border-radius:4px;font-size:11px;color:#aaa;margin:2px;border:1px solid rgba(255,255,255,.08)}
.hb span{color:#fff;font-weight:bold}
.hl,.hr{display:flex;flex-direction:column;align-items:flex-start}
.hr{align-items:flex-end}

.touch{position:fixed;bottom:12px;left:12px;right:12px;display:none;justify-content:space-between;align-items:flex-end;z-index:30}
.touch.on{display:flex}
.dp{display:grid;grid-template:repeat(3,44px)/repeat(3,44px);gap:2px}
.db{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:8px;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center}
.db:active{background:rgba(255,255,255,.25)}
.de{background:none;border:none}
.ab{display:flex;flex-direction:column;gap:5px}
.abtn{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:10px;font-family:inherit;display:flex;align-items:center;justify-content:center}
.abtn:active{background:rgba(255,255,255,.25)}

#title-screen{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;background-image:url(assets/office.png);background-size:cover;background-position:center}
#title-screen::before{content:'';position:absolute;inset:0;background:rgba(0,0,0,.65)}
#title-screen::after{content:'';position:absolute;inset:0;background-image:url(assets/background.gif);background-size:50vw;opacity:.3;pointer-events:none}
#title-screen.gone{display:none}
#title-screen>*{position:relative;z-index:1}
.ts-logo{max-width:min(400px,80vw);height:auto;margin-bottom:8px}
.ts-baby{position:absolute;right:5vw;top:5vh;height:85vh;opacity:.6;z-index:0!important}
.ts-sub{font-size:clamp(11px,2vw,16px);color:#888;letter-spacing:3px;margin-bottom:24px}
.ts-btn{padding:12px 36px;background:transparent;border:1px solid rgba(168,85,247,.4);color:#a855f7;font-family:inherit;font-size:15px;border-radius:24px;cursor:pointer;letter-spacing:3px;transition:all .3s}
.ts-btn:hover{background:rgba(168,85,247,.15);box-shadow:0 0 30px rgba(168,85,247,.2)}
.ts-hint{margin-top:14px;font-size:10px;color:#444}

#msg{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.88);border:1px solid rgba(168,85,247,.25);padding:8px 18px;border-radius:6px;color:#ccc;font-size:12px;z-index:40;opacity:0;transition:opacity .3s;text-align:center;max-width:88vw;pointer-events:none}
#msg.show{opacity:1}

.vig{position:fixed;inset:0;pointer-events:none;z-index:15;opacity:.7}

#jumpscare{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:#000}
#jumpscare.on{display:flex}

#gameover{position:fixed;inset:0;z-index:300;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.96)}
#gameover.on{display:flex}
.go-t{font-size:clamp(28px,6vw,48px);color:#ff2020;letter-spacing:6px;text-shadow:0 0 40px rgba(255,0,0,.5)}
.go-s{font-size:13px;color:#555;margin-top:10px}
.go-b{margin-top:20px;padding:10px 28px;background:transparent;border:1px solid rgba(255,255,255,.15);color:#aaa;font-family:inherit;font-size:13px;border-radius:20px;cursor:pointer}

#nighttxt{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:clamp(24px,6vw,52px);color:#fff;text-shadow:0 0 40px rgba(168,85,247,.6);z-index:50;opacity:0;transition:opacity .6s;pointer-events:none}
#nighttxt.show{opacity:1}

.pw{animation:pwarn 1s infinite}
@keyframes pwarn{0%,100%{color:#ff4444}50%{color:#882222}}
</style>
</head>
<body>

<canvas id="c"></canvas>
<img src="assets/vignette.png" class="vig" id="vig-img">

<div id="title-screen">
    <img src="assets/title.png" class="ts-logo" alt="FNAF SL">
    <img src="assets/animatronic.png" class="ts-baby" alt="Circus Baby">
    <div class="ts-sub">× R A F T&ensp;&ensp;F U S I O N</div>
    <button class="ts-btn" onclick="startGame()">S T A R T</button>
    <div class="ts-hint">WASD / Pfeiltasten · E = Interagieren · LEERTASTE = Kameras</div>
</div>

<div class="hud" id="hud">
    <div class="hl">
        <div class="hb">HP: <span id="hHP">100</span></div>
        <div class="hb">Hunger: <span id="hHunger">100</span></div>
        <div class="hb" id="hPwrW">Power: <span id="hPwr">100</span>%</div>
    </div>
    <div class="hr">
        <div class="hb" id="hLoc">Ozean</div>
        <div class="hb">Nacht <span id="hN">1</span></div>
        <div class="hb" id="hTime">12:00 AM</div>
    </div>
</div>

<div class="touch" id="tch">
    <div class="dp">
        <div class="de"></div><div class="db" data-d="u">&#9650;</div><div class="de"></div>
        <div class="db" data-d="l">&#9668;</div><div class="de"></div><div class="db" data-d="r">&#9658;</div>
        <div class="de"></div><div class="db" data-d="d">&#9660;</div><div class="de"></div>
    </div>
    <div class="ab">
        <div class="abtn" data-a="e">USE</div>
        <div class="abtn" data-a="cam">CAM</div>
    </div>
</div>

<div id="msg"></div>
<div id="nighttxt"></div>
<div id="jumpscare"><canvas id="jsc"></canvas></div>
<div id="gameover">
    <div class="go-t">GAME OVER</div>
    <div class="go-s" id="goR"></div>
    <button class="go-b" onclick="restart()">Nochmal</button>
</div>

<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d');
let W,H;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}
resize();addEventListener('resize',resize);

// Preload assets
const IMG={};
const ASSETS={office:'assets/office.png',baby:'assets/animatronic.png',vignette:'assets/vignette.png',title:'assets/title.png',glitch:'assets/background.gif'};
for(const[k,src]of Object.entries(ASSETS)){const i=new Image();i.onload=()=>{IMG[k]=i};i.src=src}

// State
const S={phase:'title',night:1,time:0,timeSpd:.12,power:100,hp:100,hunger:100,score:0,
    raftX:0,raftY:0,dir:0,room:0,doorL:true,doorR:true,camOn:false,camSel:0,
    anims:[],debris:[],raftWood:0,islandX:0,islandY:0,foundIsland:false,enteredFac:false,msgT:0,tick:0,lookX:0};

const ROOMS=[
    {name:'Private Room',conn:[2,3]},{name:"Circus Baby's Auditorium",conn:[2]},
    {name:'Ballora Gallery',conn:[0,1,4]},{name:'Funtime Auditorium',conn:[0,5]},
    {name:'Parts & Service',conn:[2]},{name:'Scooping Room',conn:[3]}
];
const ADEFS=[
    {name:'Circus Baby',color:'#ff3366',start:1,spd:.3,agg:2},
    {name:'Ballora',color:'#5566ff',start:2,spd:.5,agg:3},
    {name:'Funtime Freddy',color:'#ff77bb',start:3,spd:.2,agg:4},
    {name:'Funtime Foxy',color:'#ff6622',start:4,spd:.6,agg:3},
    {name:'Ennard',color:'#bbbbbb',start:5,spd:.4,agg:5}
];

// Input
const K={};let useK=false,camK=false;
onkeydown=e=>{K[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')useK=true;if(e.key===' '){e.preventDefault();camK=true}};
onkeyup=e=>{K[e.key.toLowerCase()]=false};
if('ontouchstart'in window)document.getElementById('tch').classList.add('on');
document.querySelectorAll('.db').forEach(b=>{
    const m={u:'w',d:'s',l:'a',r:'d'};
    b.addEventListener('touchstart',e=>{e.preventDefault();K[m[b.dataset.d]]=true});
    b.addEventListener('touchend',e=>{e.preventDefault();K[m[b.dataset.d]]=false});
});
document.querySelectorAll('.abtn').forEach(b=>{
    b.addEventListener('touchstart',e=>{e.preventDefault();if(b.dataset.a==='e')useK=true;if(b.dataset.a==='cam')camK=true});
});

function msg(t,dur=120){const el=document.getElementById('msg');el.textContent=t;el.classList.add('show');S.msgT=dur}
function showNight(n){const el=document.getElementById('nighttxt');el.textContent='Nacht '+n;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2500)}
function updHUD(){
    document.getElementById('hHP').textContent=Math.max(0,Math.floor(S.hp));
    document.getElementById('hHunger').textContent=Math.max(0,Math.floor(S.hunger));
    document.getElementById('hPwr').textContent=Math.max(0,Math.floor(S.power));
    const pw=document.getElementById('hPwrW');
    pw.style.display=S.phase==='raft'?'none':'';
    if(S.power<15)pw.classList.add('pw');else pw.classList.remove('pw');
    document.getElementById('hLoc').textContent=S.phase==='raft'?'Ozean':S.phase==='cameras'?'Kameras':ROOMS[S.room].name;
    document.getElementById('hN').textContent=S.night;
    const hrs=Math.floor(S.time/60),mins=Math.floor(S.time%60),h=12+hrs;
    document.getElementById('hTime').textContent=(h>12?h-12:h)+':'+String(mins).padStart(2,'0')+' AM';
}

// === OCEAN ===
function drawOcean(t){
    const g=cx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#051530');g.addColorStop(.5,'#062040');g.addColorStop(1,'#020e28');
    cx.fillStyle=g;cx.fillRect(0,0,W,H);
    cx.globalAlpha=.15;
    for(let l=0;l<3;l++){
        cx.beginPath();cx.moveTo(0,H);
        for(let x=0;x<=W;x+=8){
            const y=H*(.3+l*.15)+Math.sin((x+t*(1.5+l)+l*200)*.008)*(15+l*8)+Math.sin((x+t*(.8-l*.2))*.015)*(10+l*5);
            cx.lineTo(x,y);
        }
        cx.lineTo(W,H);cx.fillStyle=`rgba(${40+l*20},${80+l*30},${140+l*30},.3)`;cx.fill();
    }
    cx.globalAlpha=1;
    for(let i=0;i<20;i++){
        const sx=(Math.sin(t*.01+i*73.7)*.5+.5)*W,sy=(Math.cos(t*.008+i*47.3)*.5+.5)*H;
        cx.fillStyle=`rgba(150,200,255,${(Math.sin(t*.05+i*11)*.5+.5)*.12})`;
        cx.fillRect(sx,sy,2,2);
    }
}

function drawRaftObj(x,y,sz){
    for(let i=0;i<4+Math.min(S.raftWood,4);i++){
        const n=3+Math.min(S.raftWood,4);
        cx.fillStyle=i%2?'#7B5E3A':'#5B3E1A';
        cx.fillRect(x-sz/2+i*sz/n,y-sz/2,sz/n-1,sz);
    }
    cx.strokeStyle='#8B7B5A';cx.lineWidth=2;
    cx.strokeRect(x-sz/2+2,y-sz/4,sz-4,2);
    cx.strokeRect(x-sz/2+2,y+sz/4,sz-4,2);
    if(S.raftWood>=3){
        cx.fillStyle='#997755';cx.fillRect(x-1,y-sz/2-30,3,30);
        cx.fillStyle='rgba(200,180,150,.7)';
        cx.beginPath();cx.moveTo(x+2,y-sz/2-28);
        cx.lineTo(x+20+Math.sin(S.tick*.03)*3,y-sz/2-14);
        cx.lineTo(x+2,y-sz/2);cx.fill();
    }
}

function drawIsland(ix,iy){
    cx.fillStyle='rgba(30,80,100,.3)';cx.beginPath();cx.ellipse(ix,iy+15,110,50,0,0,Math.PI*2);cx.fill();
    cx.fillStyle='#b8a474';cx.beginPath();cx.ellipse(ix,iy+10,90,38,0,0,Math.PI*2);cx.fill();
    cx.fillStyle='#2d5a27';cx.beginPath();cx.ellipse(ix,iy-5,75,45,0,0,Math.PI*2);cx.fill();
    cx.fillStyle='#3a7a32';cx.beginPath();cx.ellipse(ix-10,iy-8,55,35,0,0,Math.PI*2);cx.fill();
    // Palm
    cx.fillStyle='#5a3a1a';cx.fillRect(ix+30,iy-60,6,55);
    cx.fillStyle='#2a7a22';
    for(let i=0;i<5;i++){cx.save();cx.translate(ix+33,iy-60);cx.rotate(i*1.25-2.5+Math.sin(S.tick*.02)*.05);cx.fillRect(0,-3,25,6);cx.restore()}
    // Building
    cx.fillStyle='#1a1025';cx.fillRect(ix-35,iy-55,70,55);
    cx.fillStyle='#2a1a3a';cx.beginPath();cx.moveTo(ix-40,iy-55);cx.lineTo(ix,iy-75);cx.lineTo(ix+40,iy-55);cx.fill();
    cx.fillStyle='#0a0515';cx.fillRect(ix-9,iy-28,18,28);
    const gl=.4+Math.sin(S.tick*.04)*.2;
    cx.fillStyle=`rgba(255,50,50,${gl})`;cx.fillRect(ix-28,iy-48,12,10);cx.fillRect(ix+16,iy-48,12,10);
    if(S.foundIsland){
        cx.fillStyle='#a855f7';cx.font='bold 8px monospace';cx.textAlign='center';
        cx.fillText("CIRCUS BABY'S",ix,iy-78);
        cx.fillStyle='#777';cx.font='6px monospace';cx.fillText('ENTERTAINMENT & RENTAL',ix,iy-70);
    }
}

// === RAFT PHASE ===
function initRaft(){
    S.phase='raft';S.raftX=0;S.raftY=0;
    const a=Math.random()*Math.PI*2;S.islandX=Math.cos(a)*700;S.islandY=Math.sin(a)*700;
    S.debris=[];
    for(let i=0;i<20;i++)S.debris.push({x:(Math.random()-.5)*2500,y:(Math.random()-.5)*2500,type:Math.random()>.45?'wood':'food',got:false,bob:Math.random()*Math.PI*2});
    msg('Du treibst im Ozean... Sammle Treibgut mit E. Finde die mysteriöse Insel!',200);
}

function updateRaft(){
    const spd=2.8;let dx=0,dy=0;
    if(K.w||K.arrowup){dy=-spd;S.dir=2}
    if(K.s||K.arrowdown){dy=spd;S.dir=0}
    if(K.a||K.arrowleft){dx=-spd;S.dir=1}
    if(K.d||K.arrowright){dx=spd;S.dir=3}
    if(dx&&dy){dx*=.707;dy*=.707}
    S.raftX+=dx;S.raftY+=dy;
    S.hunger-=.007;
    if(S.hunger<=0){S.hunger=0;S.hp-=.05}
    if(S.hp<=0){gameOver('Du bist verhungert auf dem Ozean.');return}

    if(useK){
        useK=false;
        for(const d of S.debris){
            if(d.got)continue;
            const sx=d.x-S.raftX+W/2,sy=d.y-S.raftY+H/2;
            if(Math.hypot(sx-W/2,sy-H/2)<50){
                d.got=true;
                if(d.type==='food'){S.hunger=Math.min(100,S.hunger+20);msg('Essen gefunden! +20 Hunger',80)}
                else{S.raftWood++;msg('Holz gesammelt! ('+S.raftWood+' Stueck)',80)}
                S.score+=10;
            }
        }
        const ix=S.islandX-S.raftX+W/2,iy=S.islandY-S.raftY+H/2;
        if(Math.hypot(ix-W/2,iy-H/2)<100&&S.foundIsland){enterFacility();return}
    }

    const dist=Math.hypot(S.islandX-S.raftX,S.islandY-S.raftY);
    if(dist<350&&!S.foundIsland){S.foundIsland=true;msg('Eine mysteriöse Insel! "Circus Baby\'s Entertainment & Rental" - Druecke E zum Betreten!',300)}

    for(const d of S.debris){if(!d.got){d.bob+=.02;d.x+=Math.sin(S.tick*.005+d.y*.01)*.15;d.y+=Math.cos(S.tick*.005+d.x*.01)*.15}}
}

function drawRaftPhase(){
    drawOcean(S.tick);
    const camX=S.raftX-W/2,camY=S.raftY-H/2;
    for(const d of S.debris){
        if(d.got)continue;
        const sx=d.x-camX,sy=d.y-camY+Math.sin(d.bob)*4;
        if(sx<-40||sx>W+40||sy<-40||sy>H+40)continue;
        if(d.type==='wood'){
            cx.fillStyle='#7B5E3A';cx.save();cx.translate(sx,sy);cx.rotate(Math.sin(d.bob)*.2);
            cx.fillRect(-10,-4,20,8);cx.fillStyle='#6B4E2A';cx.fillRect(-8,-3,16,6);cx.restore();
        }else{
            cx.fillStyle='#44aa44';cx.beginPath();cx.arc(sx,sy,7,0,Math.PI*2);cx.fill();
            cx.fillStyle='#66cc66';cx.fillRect(sx-1,sy-10,2,5);
        }
    }
    const ix=S.islandX-camX,iy=S.islandY-camY;
    if(ix>-200&&ix<W+200&&iy>-200&&iy<H+200)drawIsland(ix,iy);
    drawRaftObj(W/2,H/2,40+Math.min(S.raftWood,5)*6);
    // Player
    cx.fillStyle='#4488ff';cx.fillRect(W/2-6,H/2-16,12,18);
    cx.fillStyle='#88bbff';cx.fillRect(W/2-5,H/2-20,10,8);
    cx.fillStyle='#fff';cx.fillRect(W/2-3,H/2-18,2,2);cx.fillRect(W/2+1,H/2-18,2,2);
    // Arrow
    const distI=Math.hypot(S.islandX-S.raftX,S.islandY-S.raftY);
    if(distI>200||!S.foundIsland){
        const ang=Math.atan2(S.islandY-S.raftY,S.islandX-S.raftX);
        const ax=W/2+Math.cos(ang)*90,ay=H/2+Math.sin(ang)*90;
        cx.fillStyle='#a855f7';cx.beginPath();cx.arc(ax,ay,8,0,Math.PI*2);cx.fill();
        cx.fillStyle='#fff';cx.font='bold 10px monospace';cx.textAlign='center';cx.fillText('?',ax,ay+4);
    }
    cx.fillStyle='rgba(200,200,255,.5)';cx.font='12px monospace';cx.textAlign='center';
    cx.fillText('Insel: '+Math.floor(distI/8)+'m',W/2,36);
    const vg=cx.createRadialGradient(W/2,H/2,Math.min(W,H)*.25,W/2,H/2,Math.max(W,H)*.7);
    vg.addColorStop(0,'transparent');vg.addColorStop(1,'rgba(0,0,20,.6)');
    cx.fillStyle=vg;cx.fillRect(0,0,W,H);
}

// === FACILITY ===
function enterFacility(){
    S.phase='facility';S.room=0;S.enteredFac=true;
    S.power=100;S.time=0;S.doorL=true;S.doorR=true;S.camOn=false;S.lookX=0;
    S.anims=ADEFS.slice(0,Math.min(S.night+1,5)).map(a=>({...a,room:a.start,moveT:0,atDoor:false,side:null}));
    showNight(S.night);
    msg('Ueberlebe bis 6 AM! Links/Rechts schauen + E = Tueren. LEERTASTE = Kameras.',250);
}

function updateFacility(){
    S.time+=S.timeSpd;
    if(S.time>=360){
        S.night++;S.phase='raft';S.score+=100;
        msg('Nacht '+(S.night-1)+' ueberlebt! Zurueck auf dem Ozean...',200);
        for(let i=0;i<10;i++)S.debris.push({x:S.raftX+(Math.random()-.5)*1200,y:S.raftY+(Math.random()-.5)*1200,type:Math.random()>.4?'wood':'food',got:false,bob:Math.random()*Math.PI*2});
        return;
    }
    let drain=.012;
    if(S.doorL)drain+=.006;if(S.doorR)drain+=.006;if(S.camOn)drain+=.012;
    S.power-=drain;
    if(S.power<=0){S.power=0;S.doorL=false;S.doorR=false;S.camOn=false;if(Math.random()<.015){gameOver('Kein Strom. Funtime Freddy hat dich im Dunkeln gefunden.');return}}
    if(K.a||K.arrowleft)S.lookX=Math.max(S.lookX-4,-1);
    if(K.d||K.arrowright)S.lookX=Math.min(S.lookX+4,1);
    if(!K.a&&!K.arrowleft&&!K.d&&!K.arrowright)S.lookX*=.92;
    if(Math.abs(S.lookX)<.05)S.lookX=0;
    if(S.lookX<-.5)S.dir=1;else if(S.lookX>.5)S.dir=3;else S.dir=0;
    if(useK){
        useK=false;
        if(S.dir===1&&S.power>0){S.doorL=!S.doorL;msg(S.doorL?'Linke Tuer ZU':'Linke Tuer AUF',50)}
        else if(S.dir===3&&S.power>0){S.doorR=!S.doorR;msg(S.doorR?'Rechte Tuer ZU':'Rechte Tuer AUF',50)}
    }
    if(camK){camK=false;if(S.camOn){S.camOn=false;S.phase='facility'}else if(S.power>0){S.camOn=true;S.phase='cameras';S.camSel=0}}
    for(const a of S.anims){
        a.moveT+=a.spd*(1+S.night*.18);
        if(a.moveT>100){
            a.moveT=0;
            if(a.room===0){
                if(a.side==='left'&&!S.doorL){jumpscare(a);return}
                if(a.side==='right'&&!S.doorR){jumpscare(a);return}
                if(!a.side)a.side=Math.random()>.5?'left':'right';
                if(Math.random()<.25){a.room=a.start;a.side=null;a.atDoor=false}
            }else{
                if(Math.random()<(a.agg+S.night)*.055){
                    const r=ROOMS[a.room];
                    if(r&&r.conn.length){const next=r.conn[Math.floor(Math.random()*r.conn.length)];a.room=next;if(next===0){a.atDoor=true;a.side=Math.random()>.5?'left':'right'}}
                }
            }
        }
    }
}

function drawFacility(){
    // REAL office background with parallax
    if(IMG.office){
        const iw=IMG.office.width,ih=IMG.office.height;
        const sc=Math.max(W/iw,H/ih)*1.3;
        const dw=iw*sc,dh=ih*sc;
        cx.drawImage(IMG.office,(W-dw)/2+S.lookX*W*.15,(H-dh)/2,dw,dh);
    }else{cx.fillStyle='#0d0d18';cx.fillRect(0,0,W,H)}

    const dw2=W*.08;
    // Left door
    if(S.doorL){cx.fillStyle='rgba(40,40,60,.85)';cx.fillRect(0,H*.2,dw2,H*.6);cx.fillStyle='#ff3333';cx.font='bold 12px monospace';cx.textAlign='center';cx.fillText('LOCKED',dw2/2,H*.5)}
    else{cx.fillStyle='rgba(0,0,0,.3)';cx.fillRect(0,H*.2,dw2,H*.6);cx.fillStyle='#33ff33';cx.font='bold 12px monospace';cx.textAlign='center';cx.fillText('OPEN',dw2/2,H*.5)}
    // Right door
    if(S.doorR){cx.fillStyle='rgba(40,40,60,.85)';cx.fillRect(W-dw2,H*.2,dw2,H*.6);cx.fillStyle='#ff3333';cx.textAlign='center';cx.fillText('LOCKED',W-dw2/2,H*.5)}
    else{cx.fillStyle='rgba(0,0,0,.3)';cx.fillRect(W-dw2,H*.2,dw2,H*.6);cx.fillStyle='#33ff33';cx.textAlign='center';cx.fillText('OPEN',W-dw2/2,H*.5)}

    // Animatronics at doors with REAL images
    for(const a of S.anims){
        if(a.room===0){
            const isL=a.side==='left';
            const dx2=isL?dw2+10:W-dw2-10;
            const closed=isL?S.doorL:S.doorR;
            if(!closed){
                if(a.name==='Circus Baby'&&IMG.baby){
                    const bh=H*.5,bw=bh*(IMG.baby.width/IMG.baby.height);
                    cx.globalAlpha=.85;cx.drawImage(IMG.baby,dx2-bw/2,H*.3,bw,bh);cx.globalAlpha=1;
                }else{
                    cx.fillStyle=a.color;cx.globalAlpha=.7;cx.fillRect(dx2-15,H*.35,30,H*.35);
                    cx.fillStyle='#ff0000';cx.globalAlpha=.9;
                    cx.beginPath();cx.arc(dx2-6,H*.42,4,0,Math.PI*2);cx.fill();
                    cx.beginPath();cx.arc(dx2+6,H*.42,4,0,Math.PI*2);cx.fill();
                    cx.globalAlpha=1;
                    cx.fillStyle='rgba(255,255,255,.5)';cx.font='9px monospace';cx.textAlign='center';cx.fillText(a.name,dx2,H*.73);
                }
            }
        }
    }

    cx.fillStyle='rgba(255,255,255,.25)';cx.font='12px monospace';cx.textAlign='center';
    cx.fillText(ROOMS[S.room].name,W/2,H-12);

    if(S.power<=0){
        cx.fillStyle='rgba(0,0,0,'+(0.9+Math.sin(Date.now()*.002)*.05)+')';cx.fillRect(0,0,W,H);
        if(Math.random()<.3){cx.fillStyle='rgba(255,0,0,.6)';const ex=W*.3+Math.random()*W*.4,ey=H*.3+Math.random()*H*.2;cx.beginPath();cx.arc(ex,ey,3,0,Math.PI*2);cx.fill();cx.beginPath();cx.arc(ex+12,ey,3,0,Math.PI*2);cx.fill()}
    }
    if(Math.random()<.03){cx.fillStyle='rgba(255,255,255,'+Math.random()*.04+')';cx.fillRect(0,0,W,H)}
    if(IMG.vignette){cx.globalAlpha=.6;cx.drawImage(IMG.vignette,0,0,W,H);cx.globalAlpha=1}
    if(IMG.glitch&&Math.random()<.05){cx.globalAlpha=.08;cx.drawImage(IMG.glitch,0,0,W,H);cx.globalAlpha=1}
}

// === CAMERAS ===
function drawCameras(){
    cx.fillStyle='#060812';cx.fillRect(0,0,W,H);
    cx.fillStyle='rgba(0,40,0,.04)';for(let y=0;y<H;y+=2)cx.fillRect(0,y,W,1);
    for(let i=0;i<400;i++){cx.fillStyle='rgba(255,255,255,'+Math.random()*.06+')';cx.fillRect(Math.random()*W,Math.random()*H,Math.random()*3,Math.random()*3)}
    cx.fillStyle='#1a1a1a';cx.font='bold 14px monospace';cx.textAlign='center';cx.fillText('SURVEILLANCE CAMERAS',W/2,26);
    cx.fillStyle=S.tick%60<30?'#ff0000':'#880000';cx.beginPath();cx.arc(W-25,25,5,0,Math.PI*2);cx.fill();
    cx.fillStyle='#ff4444';cx.font='10px monospace';cx.textAlign='right';cx.fillText('REC',W-35,29);

    const cols=3,gap=8,pad=12,cw2=(W-pad*2-gap*(cols-1))/cols,ch2=Math.min(90,(H-80-gap)/2);
    ROOMS.forEach((room,i)=>{
        const col=i%cols,row=Math.floor(i/cols);
        const x=pad+col*(cw2+gap),y=44+row*(ch2+gap);
        const sel=S.camSel===i;
        cx.fillStyle=sel?'#0a1a0a':'#0a0a12';cx.strokeStyle=sel?'#44ff44':'#1a1a22';cx.lineWidth=sel?2:1;
        cx.fillRect(x,y,cw2,ch2);cx.strokeRect(x,y,cw2,ch2);
        cx.fillStyle=sel?'#44ff44':'#444';cx.font='9px monospace';cx.textAlign='center';cx.fillText(room.name,x+cw2/2,y+14);
        const here=S.anims.filter(aa=>aa.room===i);
        here.forEach((aa,ai)=>{
            const ax2=x+cw2/2+ai*22-(here.length-1)*11,ay2=y+ch2/2+8;
            if(aa.name==='Circus Baby'&&IMG.baby){cx.drawImage(IMG.baby,ax2-10,ay2-15,20,30)}
            else{cx.fillStyle=aa.color;cx.fillRect(ax2-6,ay2-10,12,20);cx.fillStyle='#ff0000';cx.fillRect(ax2-4,ay2-7,3,3);cx.fillRect(ax2+1,ay2-7,3,3)}
        });
        if(!here.length){cx.fillStyle='#1a1a1a';cx.font='8px monospace';cx.fillText('- leer -',x+cw2/2,y+ch2/2+6)}
    });
    if(K.a||K.arrowleft){K.a=false;K.arrowleft=false;S.camSel=(S.camSel-1+ROOMS.length)%ROOMS.length}
    if(K.d||K.arrowright){K.d=false;K.arrowright=false;S.camSel=(S.camSel+1)%ROOMS.length}
    cx.fillStyle='#333';cx.font='10px monospace';cx.textAlign='center';
    cx.fillText('SPACE = close  |  Arrows = switch cam',W/2,H-14);
}

// === JUMPSCARE ===
function jumpscare(anim){
    const jc=document.getElementById('jsc'),jx=jc.getContext('2d');
    jc.width=W;jc.height=H;
    document.getElementById('jumpscare').classList.add('on');
    let f=0;
    const iv=setInterval(()=>{
        jx.fillStyle='#000';jx.fillRect(0,0,W,H);
        const shx=(Math.random()-.5)*40,shy=(Math.random()-.5)*30;
        if(anim.name==='Circus Baby'&&IMG.baby){
            const sz=H*.9,bw2=sz*(IMG.baby.width/IMG.baby.height);
            jx.drawImage(IMG.baby,W/2-bw2/2+shx,H/2-sz/2+shy,bw2,sz);
        }else{
            const sz=H*.6;jx.fillStyle=anim.color;jx.fillRect(W/2-sz/2+shx,H/2-sz/2+shy,sz,sz);
            jx.fillStyle='#ff0000';jx.fillRect(W/2-sz/4+shx,H/2-sz/5+shy,sz/6,sz/8);jx.fillRect(W/2+sz/8+shx,H/2-sz/5+shy,sz/6,sz/8);
            jx.fillStyle='#000';jx.fillRect(W/2-sz/3+shx,H/2+sz/8+shy,sz*.66,sz/5);
        }
        for(let i=0;i<500;i++){jx.fillStyle='rgba(255,255,255,'+Math.random()*.15+')';jx.fillRect(Math.random()*W,Math.random()*H,3,3)}
        jx.fillStyle='rgba(255,0,0,'+(0.1+Math.random()*.15)+')';jx.fillRect(0,0,W,H);
        f++;if(f>25){clearInterval(iv);document.getElementById('jumpscare').classList.remove('on');gameOver(anim.name+' hat dich erwischt!')}
    },50);
}

function gameOver(r){S.phase='gameover';document.getElementById('goR').textContent=r;document.getElementById('gameover').classList.add('on');document.getElementById('hud').classList.remove('on')}
function restart(){document.getElementById('gameover').classList.remove('on');S.hp=100;S.hunger=100;S.power=100;S.night=1;S.time=0;S.foundIsland=false;S.enteredFac=false;S.score=0;S.raftWood=0;initRaft();document.getElementById('hud').classList.add('on')}
function startGame(){document.getElementById('title-screen').classList.add('gone');document.getElementById('hud').classList.add('on');initRaft()}

function loop(){
    S.tick++;cx.fillStyle='#000';cx.fillRect(0,0,W,H);
    if(S.phase==='raft'){updateRaft();drawRaftPhase()}
    else if(S.phase==='facility'){updateFacility();drawFacility()}
    else if(S.phase==='cameras'){updateFacility();drawCameras()}
    if(S.phase!=='title'&&S.phase!=='gameover')updHUD();
    if(S.msgT>0){S.msgT--;if(S.msgT<=0)document.getElementById('msg').classList.remove('show')}
    useK=false;camK=false;
    requestAnimationFrame(loop);
}
loop();
</script>
